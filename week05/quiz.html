<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Along - Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form>

            <label for="q1">1. What does the acronym CSS stand for?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. How are id and class attributes selected in CSS?</label>
            <textarea id="q2" name="q2"></textarea>

            <label for="q3">3. Which keyboard shortcut toggles a CSS comment?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="1">"ctrl" + "="</option>
                <option value="2">"ctrl" + "c"</option>
                <option value="3">"ctrl" + "/"</option>
            </select>

            <label for="q4">4. How many heading levels are there in HTML?</label>
            <input type="number" id="q4" name="q4">

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>

    </footer>
</body>

</html>
